# The Grand Endeavors framework: what we track. The single source of the
# endeavor definitions, read by the pipeline (gather intake/assess prompts,
# ledger topic tags, bulletin snapshots) and rendered as the published
# dashboard (views/explore.py). README.md only points here.
#
# Schema:
#   endeavors: list of sections or groups (a group has `sections:`; a
#     `supplemental: true` group holds sections outside the five endeavors).
#   section: id (= ledger section, core/ledger.py SECTIONS), title, intro?,
#     kpi?, milestones?, milestones_order?, challenges_heading?, challenges?
#   milestones_order: sequence (each milestone is expected after the one before it, in the
#     listed order; shown as a numbered chain with arrows) or parallel (the default:
#     independent fronts that can fall in any order)
#   milestone / challenge: slug, name, description, details? (sub-bullets:
#     precise criteria, or tech-tree branches), assumes? (milestones: a gate
#     in the wording that is not the point, e.g. an editorial policy; the ETA
#     and status are judged as if it held, gather/RUBRIC.md §4.2), anchors?
#     (milestones: external community forecasts of the same or a bounding event,
#     {source: manifold|metaculus, id, relation: same|weaker|stronger|similar, by: deadline
#     of a binary question, note: wording differences (required for similar)}, collected by gather/collectors/anchors.py; core/anchoring.py,
#     gather/RUBRIC.md §4.1 step 4), precursors? (milestones: registered metric ids of the
#     section measuring the milestone's precursor ladder, the best achievement so far on its own
#     scale; their new values re-open the milestone like its events do; core/ledger.py fw_precursors)
# Text is Markdown (inline: *italic*, **bold**, [links](...); intro/manifesto
# may have paragraphs).
#
# Slugs are STABLE IDS: ledger events are tagged milestone:<slug> /
# challenge:<slug>. Renaming a milestone keeps its slug. Changing what a
# target means is a definition change (gather/RUBRIC.md rule 6, assess.sh
# DEFCHANGE=<commit>).

title: Five Grand Endeavors
tagline: Tracking humanity's progress in five grand endeavors — our biggest ongoing R&D projects.
manifesto: |-
  Science has a communication problem. It reports isolated discoveries (with applications often more of an afterthought), not progress towards the big outcomes. Thus, every week, we publish a newsletter updating humanity on the progress of science towards such outcomes — just as a company would report its progress to its board.

  Scientific research is valuable even to its own end, but is largely expected to be the engine of material abundance. We track the needle on five Grand Endeavors that humanity has pursued through the modern age and that will also determine the quality of life for the next 100 years.

  Each of the endeavors has a KPI assigned, as well as some key milestones and open challenges we need to solve. All of these may update and evolve over time, and are on purpose somewhat opinionated.
endeavors:
  - title: Robots and Automation
    intro: >-
      Humans have been looking to automate their lives in one way or another for most of their
      existence. From early domesticated animals to microwave ovens and freighter ships,
      automation adds a huge multiplier on human labor — we can either do more with our time, or
      spend less time working. The current frontier is automating intelligence itself: in software
      (AI) and in hardware (robots).
    sections:
      - id: robots-software
        title: AI
        kpi: AI task horizon at 80% success (Human-hours; geometric mean of the software and remote-work horizons)
        kpi_about:
          summary: "How the KPI is built: ECI, RLI, their conversions to hours, the cross-checks"
          sections:
            - text: |-
                **Task horizon** ([METR 2025](https://arxiv.org/abs/2503.14499)): the length of task, in the
                hours a skilled human professional needs for it, that AI completes on its own at a given
                success rate. We track the **80% horizon**: the task length at which the best released model
                succeeds four times out of five. It grows as AI can be trusted with longer stretches of work,
                which is what this endeavor's milestones need.

                METR measured horizons directly, but stopped updating in September 2026; the shaded span below
                covers the models it measured, by release date (the last one was released in April 2026). The
                KPI is built instead from two indices that keep being updated, each converted into METR-style hours:
                **software** from the Epoch Capabilities Index (ECI) and **remote work** from the Remote Labor
                Index (RLI); the KPI is their geometric mean. The right-hand scales show the raw index values
                that correspond to each height. Where METR's own measurements exist (hollow dots) they track
                the ECI line: the conversion was fitted on them. Hover over any point for the model.

                **Pace:** the legend gives each solid line's doubling time since June 2025. METR's measurements
                doubled about every 9 months until May 2024, then every 3.4 months (the dashed line). The
                software line keeps that pace. Up to February 2026 (the newest model the conversion was fitted
                on) the match is built in; since then it means ECI has kept climbing at the same rate.
              chart: task-horizon-timeline
            - title: "Software: the Epoch Capabilities Index (ECI), converted to hours"
              text: |-
                [ECI](https://epoch.ai/eci), by Epoch AI, merges dozens of benchmarks (coding, maths, science,
                agentic tasks) into one capability score per model (anchored at Claude 3.5 Sonnet = 130,
                GPT-5 = 150), on a scale that keeps working after any single benchmark saturates. It is a
                general score, not a software one, and says nothing about hours: both come from the
                conversion below, which is fitted on METR's software tasks. ECI's own inputs include METR's
                horizons and RLI (the KPI's other half); refitting it without them moves no model by more
                than 0.22 points, a twentieth of a doubling.

                **The conversion** is a straight-line fit on the 21 models that both METR and Epoch scored
                (chart): each **+4.5 ECI points doubles METR's 80% horizon**, i.e. log₂(horizon in minutes) =
                −28.24 + 0.2226 × ECI. ECI 150 → 36 min, 160 → 2.8 h, 166.8 → 7.9 h. The fit is tight
                (R² 0.97), and a single model typically lands within half a doubling of the line (the band).
                Its weak point: today's frontier
                is ~10 ECI points (about two doublings) beyond the highest-scoring model of that sample, and
                METR's series has ended, so the line is extrapolated. Its top end is also thin: GPT-5.3 Codex,
                the sample's highest model, has an ECI from just four benchmarks; without it, today's horizon
                would read 14% higher (9.1 h, not 7.9 h), well inside the band. The cross-checks below test
                the line at the frontier.
              chart: eci-calibration
              metrics: [horizon-80-software-eci, eci-frontier-by-release]
            - title: "Remote work: the Remote Labor Index (RLI), converted to hours"
              text: |-
                [RLI](https://remotelabor.ai/), by the Center for AI Safety and Scale AI
                ([paper](https://arxiv.org/abs/2510.26787)), gives AI agents 240 real paid Upwork projects
                (design, video, 3D, data analysis, games, …; median 11.5 human hours, mean 29 h) and reports one
                number per model: the **automation rate**, the share of deliverables expert graders judge as
                good as the professional's. It measures messy, economically real work end to end.

                **The conversion** uses METR's model of how success falls with task length
                ([METR 2025](https://metr.org/blog/2025-07-14-how-does-time-horizon-vary-across-domains/)):
                each doubling of a task cuts a model's odds of success by about 1.8× (METR's cross-domain
                average). We slide that curve along the length axis until its average success over RLI's project
                lengths (the bars) equals the measured automation rate; the curve's 50% point is then the 50%
                horizon, and its 80% point, always 5× shorter, the 80% horizon. Under this model, 21% of mostly
                day-long projects done means: reliable (80%) on 24-minute tasks, a coin flip (50%) at 2 hours,
                and the long projects mostly fail. The odds factor is assumed: across METR's own models it varies
                enough to put the 80% level anywhere from ~1.8× lower to ~1.5× higher, and its doubling time
                anywhere from 2.2 to 2.9 months (2.5 with the factor we use). So the remote side's level is the less certain
                one, and its pace is an estimate, not a measurement.
              chart: rli-conversion
              metrics: [horizon-80-remote-rli, rli-automation-by-release]
            - title: The blend, and how the status is judged
              text: |-
                The KPI is the **geometric mean**, √(software × remote work): the average on a log scale, so
                each side counts equally in doublings. Each side takes the best released model in its own
                domain (they may be different models), so the blend is a composite of two estimates, not one
                model's measured horizon. A doubling of either raises the KPI by √2; while both grow steadily,
                the KPI's doubling time is the harmonic mean of theirs (since June 2025: software 3.6 months,
                remote work 2.5, the KPI 2.9). The gap between the sides (about 20× in
                2026, two benchmarks and two conversions apart) is roughly the gap between "AI can code it" and
                "AI can do the job".

                **Status:** whether the KPI keeps its own pace. The assessment compares the doubling time in
                the second half of the data since June 2025 with the first half. Green while it holds or speeds
                up (a difference within noise counts as holding), yellow when it clearly slows, red when it
                stalls. There is no outside pace to measure it against: METR's long-run figure, about 7 months,
                averages the slow years before 2024 with the fast ones since, and it applies to the software
                side only. The remote side's pace depends on the success curve we assume (see its section), but
                a different curve would speed up or slow down both halves by about the same factor, so the
                halves can still be compared.
            - title: "Cross-checks: is the ECI conversion still right at the frontier?"
              text: |-
                - **[SWE-Marathon](https://www.swe-marathon.org/)** runs METR's method on 20 long software
                  tasks (4–400 h), so it measures 80% horizons directly. The *check* tile compares the horizon
                  SWE-Marathon measures with the one the ECI line gives the same model: log₂(measured ÷
                  converted), averaged over the models within 5 ECI points of the frontier. 0 means they agree,
                  +1 that the measured horizon is twice the converted one, −1 half. It is now about 0 across nine
                  frontier models (single models scatter about ±1 doubling), after +2.2 in May 2026 on one model
                  alone. The diamonds in the first chart are SWE-Marathon's best model each time, some without an
                  ECI score, so they sit above that average. With a few tasks almost always solved and many
                  almost never, it is too coarse to track the pace.
                - **METR check:** the same comparison for METR's own models, in-sample (the line was fitted on
                  them). It ends in March 2026 (METR's last model has no ECI score) at −0.4: its newest models
                  measured somewhat shorter than the line gives them.
                - **[Terminal-Bench 4.0](https://www.tbench.ai/leaderboard/terminal-bench/4.0)** (long
                  command-line tasks, not part of ECI): a horizon needs agents to fail more often on the tasks
                  that take human experts longer, and here they do not, so it gives no horizon to compare with
                  the conversion. Its best success rate is only a second, ECI-independent reading of the pace.
              metrics: [swe-marathon-h80-by-release, horizon-80-gap-swe-marathon, horizon-80-gap-metr,
                        terminal-bench-4-pass-by-release]
            - title: "UK AISI's cyber time horizon: checks the conversion's slope (hours per ECI point), not its level"
              text: |-
                The [UK AI Security Institute](https://www.aisi.gov.uk/blog/how-fast-is-autonomous-ai-cyber-capability-advancing)
                measures 80% horizons on its own capture-the-flag cyber tasks: doubling every 4.7 months since
                late 2024 (fitted through February 2026), with Claude Mythos Preview and GPT-5.5 above that
                trend (red triangles in the charts above). AISI publishes only a chart, so its values here are
                read off the figure.

                **Why its hours are not comparable:** each task run is capped at 2.5M tokens with a simple agent
                scaffold, which lowers success on purpose (AISI: uncapped horizons "would be significantly
                higher"); the tasks are narrow cyber skills, not METR's software suite; and the newest models
                saturate the suite (its longest task is 12 h, only six are 8 h or longer). Against the ECI line
                its horizons sit about 0.8 doublings lower on average (from −1.8 to +0.1 by model). So it cannot
                be pooled into the software calibration: that would mix two scales of hours.

                **What it can check is the slope**, the part the frontier extrapolation rests on. Across the 9
                models that also have an ECI score (the triangles in the ECI chart; Mythos Preview, the 4.8 h in
                the tile below, has none), AISI's horizons **double every 4.6 ECI points**, against the
                conversion's 4.5. But that leans on GPT-5.5, which AISI calls highly uncertain; without it, every
                5.6 points (about 20% flatter), and no model beyond the calibration range is left. So: compatible
                with the conversion's slope, too uncertain to validate its extrapolation. If only the slope
                beyond the calibration range were that flatter one, today's software horizon would be about 1.4×
                too high, within the half-doubling a single model typically misses the line by.
              metrics: [aisi-cyber-h80-by-release]
        milestones:
          - slug: the-linux-kernel-patch
            name: Automated Software Engineer
            description: >-
              An AI-submitted large (10k+ lines diff) patch to the Linux Kernel (or equivalent
              critical infra) is accepted by maintainers.
            assumes: >-
              maintainers judge an openly AI-submitted patch on its merits (no blanket ban on
              AI-written code, no human-submitter rule); it tracks AI engineering capability,
              not project policy.
            precursors: [ai-contribution-lines-merged-max, ai-submitted-lines-merged-max]
          - slug: the-nature-author
            name: First Automated Scientist
            description: >-
              An AI-generated research paper is accepted by a top-tier journal (Nature/Science)
              with AI credited as primary author.
            assumes: >-
              the journal would credit an AI as primary author once it clearly did the work
              (today Nature and Science bar AI authorship); it tracks AI research capability,
              not editorial policy.
            precursors: [ai-paper-venue-tier-max]
            details:
              - The flagship journals Nature or Science, not their family titles.
              - >-
                AI-generated: the AI poses the question, designs and analyses the work and writes
                the paper. Humans may fund it, provide compute, carry out lab protocols as directed
                and submit it, but contribute no ideas or text.
          - slug: the-10m-solopreneur
            name: Automated Economy Kickoff
            description: A single-person company reaches $10M ARR with <10 hours/week human oversight.
            precursors: [solo-company-arr-max, unattended-business-arr-max]
            details:
              - >-
                Single person: no employees, and no contractors running its operations (incidental
                professional services such as legal or accounting are fine). Several businesses
                owned and run by the same person count together.
              - >-
                ARR = recurring revenue, annualized. Oversight = all human time spent running the
                business(es), averaged over a quarter at ≥$10M ARR.
        challenges_heading: Major Open Challenges (assuming "LLMs are enough" hypothesis)
        challenges:
          - slug: reliability
            name: Reliability
            description: Reducing hallucinations and error compounding in long chains of reasoning.
          - slug: agency
            name: Agency
            description: Robust goal decomposition and self-correction over long time horizons.
          - slug: continuous-learning
            name: Continuous Learning
            description: Universal mechanism for rapidly adjusting long-term behavior based on past experiences.
          - slug: novelty
            name: Novelty
            description: Consistently producing original connections beyond interpolations of existing knowledge.
      - id: robots-hardware
        title: Robots
        kpi: >-
          General-purpose robots at work: the number of deployments (one robot maker at one named
          customer) in which a humanoid or other self-moving robot with arms does production work,
          autonomously as reported, minus those a later source says ended or credibly disputes.
          *Provisional, for the pioneering stage:* to be replaced by a measure of the work done
          (robots × hours × interventions) once deployments disclose it.
        kpi_about:
          summary: "What counts as a deployment, why we count them rather than robots, and the caveats"
          sections:
            - text: |-
                A deployment is one **robot maker** whose general-purpose robot works for one **named
                customer**. Four things must hold. The robot moves itself (legs, wheels, a
                mobile base) and handles the objects of the job: a humanoid, or what the trade calls a
                mobile manipulator, not an arm bolted in place. It works inside the customer's live
                operations (a factory line, a warehouse, a store) and the source says what job it does
                there; a pilot on a live line counts. The customer is an outside organization, or the
                maker's own company or corporate group if someone outside the group confirms the work.
                And a source says the robot works autonomously (on its own, without remote control);
                not mentioning remote control is not enough.

                A deployment counts once, however many robots, sites, jobs or newer models the same
                customer gets; the same maker at a second customer, or a second maker at the same
                customer, is a new deployment. The maker is whoever builds the robot, not whoever
                supplies its AI. In-house work counts because the largest deployments may well be
                in-house (Tesla, Xiaomi, Boston Dynamics at its owner Hyundai), but it needs outside
                confirmation, such as reporters who saw it on site or a regulator: the maker's own
                announcement, however widely reported, is not enough. An investor in the maker, or a
                joint-venture partner, is an outside customer. Every deployment is in the table above,
                with the job and the source's words on autonomy.

                **Not counted:** fixed arms or stations, whatever AI drives them (Dyna Robotics'
                napkin-folding arms, a humanoid torso on a stand at a sorting conveyor); self-driving
                carts and forklifts, which move but do not handle; work in the maker's own group that
                no one outside it confirms; demos, livestreams, showrooms, training centres and tests
                outside live operations; on-site training or trial runs, unless the source says their
                output goes into real production; orders, contracts, plans and deliveries with no
                reported work; a customer named only in a list of sites or users; and work no source
                calls autonomous.
            - title: Why a count of deployments, and why it is provisional
              text: |-
                The goal is robots doing human work on their own, so the ideal measure is how much work
                they do: how many robots, for how many hours, and how often a human has to step in. No
                one publishes that yet. Analysts count humanoids shipped (about 13,000 in 2025 by
                Omdia's count, over 18,000 by IDC's), but IDC puts more than 85% of those robots in
                performances, education, data collection and guided tours, and a shipment says nothing
                about autonomy. What is documented, one at a time, is deployments, so for this first
                stage we count those. The number shows how many times a maker has got a robot past
                demos and into real operations, and still has it there. It does not show how much
                work gets done: a deployment with one robot counts the same as one with a hundred.
                The KPI will be replaced once deployments disclose robots, hours and interventions.
            - title: Caveats
              text: |-
                Autonomy is as reported by the maker, the customer or the press, and none of the
                deployments has published how often humans step in. A deployment counts from the day
                its first qualifying source was published, not from when the work began. It drops out
                once a source reports it ended, or a credible source (the customer, reporters on site,
                a regulator) disputes it; a disputed one counts again when a new source documents it
                working. Both stay in the table, greyed, with that report: later reports never rewrite
                what the work was, they change the deployment's status and are shown under it. The
                deployments are those our news gathering finds; the history before October 2026 comes
                from one search back to 2023, so earlier ones may be missing, most likely Chinese ones.

                **Status:** green when the count rose more in the last 12 months than in the 12 months
                before (deployments added, less those that dropped out).
        milestones:
          - slug: robotaxi-saturation
            name: Robotaxi Saturation
            description: >-
              Autonomous robotaxis outnumber human-driven taxis in a major metropolitan area
              (driverless transport solved).
            details:
              - Taxis include ride-hail; count the vehicles in service at peak.
              - Driverless (SAE L4) service across the metro's service area qualifies; SAE L5 is not required.
          - slug: the-wozniak-test
            name: The "Wozniak" Test
            description: Robot enters a random, previously unseen home and successfully makes a cup of coffee.
            details:
              - Random and unseen = not chosen by the robot's developer, and not visited, mapped or scanned beforehand.
              - >-
                One independently verified success suffices; the robot may recover from its own
                mistakes, but no human help.
            anchors:  # approved 2026-10-15 (data ledger/audits/2026-10-15-anchors/)
              - source: manifold  # Coffee Test before 2029
                id: 92RpIcOUn9
                relation: similar
                by: "2028-12-31"
                note: >-
                  The market adds a 20-minute limit but lacks explicit developer-independent home
                  selection, no prior mapping, and independent verification. Net direction: mixed; looser
                  test controls favor earlier success, while the time limit favors later success.
              - source: manifold  # Coffee Test before 2027
                id: ZA8292N5QC
                relation: similar
                by: "2026-12-31"
                note: >-
                  The market adds a 20-minute limit but lacks explicit developer-independent home
                  selection, no prior mapping, and independent verification. Net direction: mixed; looser
                  test controls favor earlier success, while the time limit favors later success.
          - slug: the-fukushima-test
            name: The "Fukushima" Test
            description: >-
              Robot autonomously navigates a disaster zone and performs a critical repair
              (valve/switch) within human time limits.
            details:
              - >-
                A realistic staged disaster site counts (unscripted, rubble, degraded comms
                and lighting; DARPA Robotics Challenge style but autonomous); a real disaster is
                not required.
          - slug: the-blue-collar-shift
            name: The "Blue Collar" Shift
            description: >-
              A general-purpose robot works full shifts in a real workplace (construction,
              factory, logistics) alongside humans for a month.
            details:
              - 8h+ shifts on 30 consecutive working days, at ≥90% of the job's required throughput.
              - No teleoperation; a disclosed average of ≤1 human intervention per shift.
          - slug: the-dark-line
            name: The Dark Line
            description: >-
              A production line staffed only by general-purpose robots runs a full week, 24/7,
              with no humans on the floor.
            details:
              - >-
                A real line of 5+ stations; robots also do material moves and routine maintenance,
                including their own (charging, battery swaps).
              - >-
                ≥90% of the line's required throughput, with one product changeover by software
                alone during the run.
              - >-
                Purpose-built lights-out automation ("dark factories") does not count; it is
                reported under Beyond. General-purpose = robots that software alone could move to
                other jobs (humanoids, mobile manipulators), not machines built for this line.
              - >-
                No teleoperation and no remote fault-fixing; a remote human may only give
                job-level orders (e.g. start the changeover).
        challenges:
          - slug: dexterous-manipulation
            name: Dexterous Manipulation
            description: >-
              Human-level hands requiring dense tactile sensing, compliant actuators, and
              real-time control across 10,000+ object types including deformables.
          - slug: generalization
            name: Generalization
            description: >-
              Few-shot skill acquisition, robust task transfer across environments, recovery from
              unexpected failures, and long-horizon replanning without human intervention.
          - slug: power-efficiency-cost
            name: Power/Efficiency/Cost
            description: >-
              Extending 1-2 hour runtimes to full 8-hour shifts via battery breakthroughs or
              radical actuator efficiency gains, at commercially viable price points.
  - id: rockets
    title: Rockets and Space
    intro: >-
      What child hasn't looked at the starry sky in wonder? The universe promises many worlds
      humanity could spread to — removing some eggs from the "one basket", a new age of discovery,
      making all raw materials cheap, and vast opportunities for community independence. And if
      nothing else, transport by orbital flights is the next best thing to teleportation, allowing
      you to reach the opposite side of the globe in 90 minutes.
    kpi: >-
      Cost to LEO ($/kg): the cheapest published price per kg to low Earth orbit of a dedicated
      launch among the rockets in service, inflation-adjusted (constant 2025 $)
    milestones_order: sequence
    milestones:
      - slug: the-deluge
        name: The Deluge
        description: >-
          100,000 tonnes delivered to orbit in a single year — the threshold to enable Mars
          colonization.
        details:
          - Cargo plus propellant delivered by tanker flights counts; the launch vehicles themselves do not.
      - slug: the-export
        name: The Export
        description: Product manufactured in space is sold commercially on Earth (beyond novelty items).
        details:
          - >-
            Recurring commercial sales of a space-manufactured product line, from repeated
            production, to customers who use it for its function: sales from ongoing production,
            not stock from a few experimental flights (e.g. NIST's "space beads", sold from 1985),
            and not material supplied for clinical trials.
      - slug: the-homestead
        name: The Homestead
        description: Permanent crewed base operates 1+ year using local resources (Moon or Mars).
        details:
          - >-
            Continuously crewed for 12+ months, and life-sustaining self-sufficient: the crew's
            air, water and food come from local resources and recycling for the whole year, with
            no resupply of consumables from Earth (equipment and spare parts may still come from
            Earth).
        anchors:  # approved 2026-10-15 (data ledger/audits/2026-10-15-anchors/)
          - source: manifold  # self-sustaining extraterrestrial colony before 2050
            id: InfkbfL3uNM9GNq9qgKy
            relation: similar
            by: "2049-12-31"
            note: >-
              The market allows any extraterrestrial location and expected extended autonomy instead
              of a completed crewed year without consumable resupply. Net direction: mixed; broader
              locations and prospective proof favor earlier resolution, while continued sustainability
              expectations can favor later resolution.
    challenges:
      - slug: radiation-shielding
        name: Radiation Shielding
        description: Protecting crew from cosmic and solar radiation during months-long deep space transits.
      - slug: closed-loop-life-support
        name: Closed-Loop Life Support
        description: Years-long operation without resupply from Earth.
      - slug: isru-at-scale
        name: ISRU at Scale
        description: Production-level extraction of fuel, oxygen, and materials from planetary resources.
  - id: fusion
    title: Fusion and Energy
    intro: >-
      Energy is the key limiting factor of the material world. It does not have to be. If all
      electricity bills go to zero, how does that change our lives, from heating (homes, iron or
      saltwater) to food, to travel, to compute? There are many short-term fixes, but the
      long-term approach is unlikely to be anything but nuclear fusion (and superconductors make
      everything easier).
    kpi: >-
      Worldwide average household (retail) electricity price ($/MWh): what people actually pay,
      population- or consumption-weighted where available, inflation-adjusted (real $)
    milestones_order: sequence
    milestones:
      - slug: the-first-watt
        name: The First Watt
        description: First commercial fusion plant delivers sustained electricity to a public grid.
        details:
          - Sustained = net electricity exported under commercial operation for 3+ consecutive months.
        anchors:  # approved 2026-10-15 (data ledger/audits/2026-10-15-anchors/)
          - {source: manifold, id: pR0QngELPh, relation: weaker, by: "2035-12-31"}  # commercial fusion electricity by 2035
          - {source: manifold, id: iuBCRicRjrIzUshZxq97, relation: weaker, by: "2040-12-31"}  # engineering breakeven by 2040
      - slug: grid-parity
        name: Grid Parity
        description: Fusion Levelized Cost Of Electricity falls below $100/MWh, competitive with gas.
        details:
          - >-
            $100/MWh in constant 2025 US dollars is the test ("competitive with gas" explains
            it, it is not a second threshold).
    challenges_heading: Tech Tree
    challenges:
      - slug: d-t-fusion
        name: D-T Fusion
        description: (easiest ignition, but 14 MeV neutrons + tritium breeding required)
        details:
          - >-
            *General challenges:* tritium breeding (TBR>1) and neutron-resistant materials at
            scale
          - >-
            *Magnetic confinement* (CFS, ITER, Zap Energy) — challenges: plasma stability, heat
            exhaust, materials survival
          - >-
            *Inertial confinement* (NIF, First Light) — challenges: rep-rate (need 10 Hz), target
            cost ($50k→$0.10), driver efficiency
      - slug: aneutronic-fusion
        name: Aneutronic Fusion
        description: (D-He3, p-B11 — no neutrons/tritium, but 10× hotter, lower cross-section)
        details:
          - Helion (D-He3, 2028 target), TAE (p-B11, early 2030s)
          - >-
            Challenge: net gain at 1+ billion °C
      - slug: deep-geothermal
        name: Deep Geothermal
        description: (most viable mid-term fusion alternative)
        details:
          - Quaise, GA Drilling — millimeter-wave/plasma drilling to 10-20 km
  - id: health
    title: Health and Lifespan
    intro: >-
      Some people long for immortality, others would just prefer not to die (or live a low-quality
      life) *yet*. The biggest symbol for fixing this is our journey to cure cancer, but the fight
      against other diseases such as Alzheimer's (or potential pandemics), as well as perfected
      early diagnostics, are just as important. And to achieve not just plain longevity, but long
      healthy lifespan, eventually we need to move further — to evolve our biology, not just fight
      off diseases.
    kpi: >-
      Median country Healthy Life Expectancy (HALE) at birth (years) — currently ~63y (WHO GHE
      2021; ~72y is median *life expectancy*, not HALE)
    milestones:
      - slug: taming-cancer
        name: Taming Cancer
        description: >-
          80% of all solid tumor cases reach 10-year survival — metastatic cancer becomes a
          chronic, manageable condition.
        details:
          - >-
            Survival is relative (net) survival, the standard cancer statistic. The metastatic
            clause explains what the 80% means; it is not a separate test.
          - >-
            Judged at the frontier: the whole resident population of at least one country or
            region of 50M+ (not a selected cohort or one insurer's members) gets there;
            worldwide diffusion is not required.
      - slug: precise-screening
        name: Precise Screening
        description: >-
          >50% of major non-communicable diseases (cancer, cardiovascular, metabolic,
          neurodegeneration) caught pre-symptomatic.
        details:
          - >-
            The share of new diagnoses in a year across the four classes (case-weighted), not
            an average of the class shares. Each person counts once per class, at the first
            diagnosis of that class's disease (cancer: once per primary cancer); a small,
            poorly screened class can be outweighed.
          - >-
            Caught = the disease itself is diagnosed before its first symptom or event (e.g.
            atherosclerosis on imaging, silent AF, type 2 diabetes by routine HbA1c, cancer by
            screening). Risk factors (hypertension, prediabetes, high cholesterol) do not count.
          - >-
            Judged at the frontier: the whole resident population of at least one country or
            region of 50M+ (not a selected cohort or one insurer's members) gets there;
            worldwide diffusion is not required.
      - slug: unbroken-mind
        name: Unbroken Mind
        description: Dementia prevalence (CDR ≥1) after age 80 falls below 5%.
        details:
          - >-
            Prevalence among all residents aged 80+ of a country or region of 50M+,
            age-standardized within 80+ (WHO standard population) so that an older 80+ mix
            does not decide it; worldwide diffusion is not required.
          - >-
            CDR ≥1 or a clinical-consensus dementia diagnosis, whichever the population study
            uses; they are treated as equivalent.
      - slug: the-long-middle-age
        name: The Long Middle Age
        description: >-
          Validated interventions reverse ≥10 years of biological age (epigenetic clocks +
          functional biomarkers), with corresponding reductions in age-related disease incidence.
        anchors:  # approved 2026-10-15 (data ledger/audits/2026-10-15-anchors/)
          - source: manifold  # therapy slowing/reversing ageing before 2040
            id: 60N0viOTdZfv1F9jMM1Q
            relation: similar
            by: "2039-12-31"
            note: >-
              The market permits non-epigenetic biomarker composites and functional gains instead of
              disease-incidence reductions, but adds 100 participants, two 25% improvements, safety
              criteria and two independent validators. Net direction: mixed; easier endpoints compete
              with stricter study requirements.
    challenges:
      - slug: causal-model-of-aging
        name: Causal Model of Aging
        description: >-
          We lack a unified, predictive model explaining how molecular aging processes cause
          specific diseases — and which interventions safely extend healthspan without tradeoffs.
      - slug: predictive-biomarkers
        name: Predictive Biomarkers
        description: >-
          Identifying reliable molecular signatures that detect disease years before symptoms
          across cancer, cardiovascular, metabolic, and neurodegenerative conditions — with
          sufficient specificity to avoid overwhelming healthcare with false positives.
      - slug: safe-in-vivo-rejuvenation
        name: Safe In-Vivo Rejuvenation
        description: >-
          Resetting adult human cells via reprogramming, senolytics, or regeneration without
          inducing cancer, fibrosis, or loss of cell identity.
      - slug: programmable-immunity
        name: Programmable Immunity
        description: >-
          Continuously monitoring and reprogramming the immune system over decades to prevent
          cancer, infections, and autoimmunity without breaking tolerance.
      - slug: brain-preservation
        name: Brain Preservation
        description: >-
          Maintaining cognition and identity for 100+ year lifespans despite protein aggregates,
          vascular damage, and neuron loss — repair at scale, not just slowing decline.
  - id: climate
    title: Climate and Environment
    intro: >-
      This endeavor is unlike the other four, as it is about fixing the past rather than improving
      the future. A hundred years ago, we would have been talking about terraforming Sahara and
      Antarctica, but humanity messed up the Earth. Many historic civilizations fell to climate
      change, and we now have to clean up our mess if we are to survive into a better future.
    kpi: Atmospheric CO₂ concentration (ppm) and 10-year trend (ppm/year)
    milestones_order: sequence
    milestones:
      - slug: the-bend
        name: The Bend
        description: Year of peak global greenhouse gas emissions is definitively behind us.
        details:
          - >-
            Definitively: a major global all-GHG inventory shows the peak year 3+ years back and
            the latest year at least 1% below it.
      - slug: the-balance
        name: The Balance
        description: Global net anthropogenic greenhouse gas emissions reach approximately zero.
        details:
          - >-
            Net emissions in GWP100 (the UNFCCC convention), durable removals counted;
            approximately zero = within ±5% of 2025 gross emissions (about ±3 GtCO₂e).
      - slug: the-ceiling
        name: The Ceiling
        description: Peak warming held below +2°C.
        details:
          - >-
            Warming = the long-term human-induced warming indicator (IPCC method, vs
            1850–1900). Achieved once it has stopped rising below +2.0°C and stayed at or
            below that peak for 10 years.
    challenges:
      - slug: net-zero-transition
        name: Net-Zero Transition
        description: >-
          Balancing carbon flows across energy, industry, agriculture, and transport — through
          both emissions reduction and enhanced biological/geological uptake.
      - slug: permanent-removal
        name: Permanent Removal
        description: Capturing and storing billions of tons of CO₂ per year durably at viable cost.
      - slug: sunlight-management
        name: Sunlight Management
        description: >-
          Developing and safely governing solar radiation management complementing the other two
          challenges.
  - title: Supplemental
    supplemental: true
    sections:
      - id: knowledge-beyond
        title: The Knowledge Beyond
        intro: >-
          A great enabler for the future is deep understanding of our universe and the ability to
          manipulate it on a fine scale. Paradigm-breaking technologies like quantum computing and
          nanomachines, as well as new research ranging from mathematics to neuroscience (or, say,
          global broadband availability), may not impact any of the great endeavors directly, but
          they will reframe everything in the long run.
      - id: society-cohesion
        title: Society and Cohesion
        intro: >-
          As humanity progresses in its great endeavors, many challenges await our society. To
          survive into the future, we must pass the great filters — avoid wiping ourselves out
          with weapons of mass destruction, align our robots (align with *what*?) and learn to
          coexist with them (a new alien intelligence), as well as keep humans in some
          relationships with one another and the physical world. Meanwhile, trust is breaking,
          alienation and polarization are growing, and simulacra are getting more attractive than
          the real world. But society can adapt — 40 years ago, "open source" wasn't really a
          concept, but we fought off massive corporate capture and it now underpins vast areas of
          technology and knowledge (think: Wikipedia). What are the next philosophy, sociology,
          and social technologies best serving humanity's future?
