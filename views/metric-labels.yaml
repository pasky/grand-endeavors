# Display labels of the KPI metrics on the dashboard (views/explore.py), per section.
# Presentation only: the registry (data/metrics/<section>.csv) keeps the metric ids
# and their full definitions (shown as the tile's tooltip). A metric without a label
# here is shown by the first clause of its definition (else its id), and explore.py
# warns: add one when registering a metric.
# _inputs: per section, metrics that only feed another indicator (e.g. the two sides of
# a derived ratio); a supplemental section's pane folds them under "Fine print", and
# its overview card leaves them out.
_inputs:
  knowledge-beyond: [qday-rsa2048-qubits-needed, qday-largest-device-qubits]
# _groups: per section, a KPI pane's tiles in named groups (title, optional note, metrics in
# display order), shown after the required tiles; the section's other metrics fold under
# "more metrics we track".
_groups:
  robots-software:
    - title: The KPI and its two components
      note: "KPI = √(software × remote work)"
      metrics: [horizon-80-blended, horizon-80-software-eci, horizon-80-remote-rli]
    - title: The indices they are converted from
      metrics: [eci-frontier-by-release, rli-automation-by-release]
    - title: Cross-checks
      note: measured horizons and an independent benchmark, not part of the KPI
      metrics: [swe-marathon-h80-by-release, horizon-80-gap-swe-marathon, horizon-80-gap-metr,
                terminal-bench-4-pass-by-release]
robots-software:
  horizon-80-blended: AI task horizon at 80% success, software and remote work blended
  swe-marathon-h80-by-release: AI software task horizon at 80% success, measured on SWE-Marathon
  swe-marathon-h50-by-release: AI software task horizon at 50% success, measured on SWE-Marathon
  horizon-80-gap-swe-marathon: Cross-check, SWE-Marathon measured vs ECI-converted 80% horizon (doublings)
  horizon-80-gap-metr: Cross-check, METR measured vs ECI-converted 80% horizon (doublings)
  terminal-bench-4-pass-by-release: Cross-check, best Terminal-Bench 4.0 resolution rate
  ai-contribution-lines-merged-max: Largest AI-written code contribution merged (lines)
  ai-paper-venue-tier-max: Highest venue tier of an accepted AI-generated paper
  solo-company-arr-max: Highest reported ARR of a one-person company
  horizon-80-software-eci: AI software task horizon at 80% success (METR-equivalent, from ECI)
  horizon-80-remote-rli: AI remote-work task horizon at 80% success (from the Remote Labor Index)
  horizon-50-blended: AI task horizon at 50% success, software and remote work blended
  horizon-50-software-eci: AI software task horizon at 50% success (METR-equivalent, from ECI)
  horizon-50-remote-rli: AI remote-work task horizon at 50% success (from the Remote Labor Index)
  eci-frontier-by-release: Epoch Capabilities Index, by model release
  rli-automation-by-release: Remote Labor Index automation rate, by model release
  metr-80-horizon-by-release: AI task horizon at 80% success, by model release
  metr-50-horizon-by-release: AI task horizon at 50% success, by model release
  metr-50-horizon-frontier: AI task horizon at 50% success, frontier as evaluated
