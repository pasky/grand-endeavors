# knowledge-beyond: reference sources for gather intake (reviewed 2026-10-12; indicators 2026-10-16).
# Schema: README.md. A supplemental section: no KPI, "kpi" = its registered indicators
# (metrics/knowledge-beyond.csv). Internet use, Erdős problems, TOP500 and exoplanets are
# collected (gather/collectors/knowledge_beyond.py); the Q-Day qubit pair, the largest
# connectome and the ambient-pressure Tc record are staged by intake from the sources
# below. Everything else is section-wide ("*").
sources:
  # --- Indicators: collected ---------------------------------------------------------------------
  - name: World Bank — Individuals using the Internet (% of population)
    url: https://data.worldbank.org/indicator/IT.NET.USER.ZS
    items: [kpi]
    covers: WDI series IT.NET.USER.ZS (ITU data), by country and the World aggregate; the collector takes the World series.
    cadence: WDI updates; the year-Y World value appears during Y+1
    tier: secondary
    collector: true
  - name: Erdős problems database (T. Tao et al.)
    url: https://github.com/teorth/erdosproblems
    items: [kpi]
    covers: Status of every problem on erdosproblems.com (proved, disproved, solved, open; Lean formalizations, AI contributions), with a per-commit statistics history the collector reads.
    cadence: continuous (several commits a week)
    tier: primary
    collector: true
  - name: Erdős Problems — forum
    url: https://www.erdosproblems.com/
    items: [kpi]
    covers: The problem site and its forum, where new solutions (including AI-found ones) are posted and discussed before the database records them.
    cadence: continuous
    tier: primary
  - name: TOP500 — lists
    url: https://top500.org/lists/top500/
    items: [kpi]
    covers: The June and November TOP500 lists (HPL Rmax per system); the collector takes the rank-1 Rmax.
    cadence: twice a year, June (ISC) and November (SC)
    tier: primary
    collector: true
  - name: NASA Exoplanet Archive
    url: https://exoplanetarchive.ipac.caltech.edu/
    items: [kpi]
    covers: Confirmed exoplanet counts and new-planet announcements; the collector counts the Planetary Systems Composite table by discovery year.
    cadence: weekly table updates
    tier: primary
    collector: true
  # --- Indicators: staged by intake -----------------------------------------------------------------
  - name: arXiv — cond-mat.supr-con recent
    url: https://arxiv.org/list/cond-mat.supr-con/recent
    items: [kpi]
    covers: Superconductivity preprints, where Tc claims and their independent replications (or refutations) appear first.
    cadence: weekdays
    tier: primary
  - name: Nature — superconductors
    url: https://www.nature.com/subjects/superconductors
    items: [kpi]
    covers: Peer-reviewed superconductivity results and news across Nature journals.
    cadence: continuous
    tier: primary
  - name: FlyWire
    url: https://flywire.ai/
    items: [kpi]
    covers: The adult fly whole-brain connectome (neuron and synapse counts, releases) and its successors.
    cadence: irregular
    tier: primary
  - name: MICrONS Explorer
    url: https://www.microns-explorer.org/
    items: [kpi]
    covers: The mouse visual cortex cubic-millimetre connectome datasets (cells, neurons, synapses per release).
    cadence: irregular
    tier: primary
  - name: E11 Bio
    url: https://e11.bio/
    items: [kpi]
    covers: Effort towards whole mouse brain connectomics (expansion/barcoding methods, dataset scale).
    cadence: irregular
    tier: primary
  - name: ITU — Facts and Figures (series)
    url: https://www.itu.int/en/ITU-D/Statistics/Pages/facts/default.aspx
    items: [kpi]
    covers: Links each annual edition (2025 the latest public one at review) with the share of the world population online / offline, mobile broadband coverage, affordability.
    cadence: annual, November
    tier: primary
  - name: ITU — ICT statistics
    url: https://www.itu.int/en/ITU-D/Statistics/pages/stat/default.aspx
    items: [kpi]
    covers: ITU's country-level ICT indicators database (internet use, subscriptions), the source of the World Bank series.
    cadence: data updates mid-year and November
    tier: primary
  - name: GSMA — State of Mobile Internet Connectivity
    url: https://www.gsma.com/somic/
    items: [kpi]
    covers: Mobile internet coverage and usage gaps in low- and middle-income countries.
    cadence: annual, autumn
    tier: secondary
    note: bot-blocked
  - name: Ookla — Speedtest Global Index
    url: https://www.speedtest.net/global-index
    items: [kpi]
    covers: Median fixed and mobile broadband speeds by country.
    cadence: monthly
    tier: secondary
    note: bot-blocked
  - name: Quantum Computing Report
    url: https://quantumcomputingreport.com/
    items: [kpi]
    covers: "Industry tracker: qubit counts, gate fidelities and logical-qubit demonstrations per vendor, roadmaps, funding (the Q-Day device indicator: qubits at ≤0.1% two-qubit error)."
    cadence: daily news; tracker tables continuous
    tier: secondary
  # --- Quantum computing ------------------------------------------------------------------------
  - name: Google Quantum AI — research
    url: https://quantumai.google/research
    items: ["*"]
    covers: Error-correction milestones (below-threshold logical qubits), verifiable quantum advantage results.
    cadence: irregular
    tier: primary
  - name: IBM Quantum — blog
    url: https://www.ibm.com/quantum/blog
    items: ["*"]
    covers: Processor roadmap (Starling fault-tolerant system by 2029), qLDPC codes, quantum-advantage claims.
    cadence: irregular
    tier: primary
  - name: Quantinuum — news
    url: https://www.quantinuum.com/news/news
    items: ["*"]
    covers: Trapped-ion systems (Helios), logical-qubit and fidelity records.
    cadence: irregular
    tier: primary
  - name: arXiv — quant-ph recent
    url: https://arxiv.org/list/quant-ph/recent
    items: ["*"]
    covers: Quantum information and hardware preprints (where error-correction results and RSA-2048 factoring resource estimates appear first).
    cadence: weekdays
    tier: primary
  # --- Nanotechnology / materials -----------------------------------------------------------------
  - name: Nature Nanotechnology
    url: https://www.nature.com/nnano/
    items: ["*"]
    covers: Peer-reviewed nanoscale materials, devices, molecular machines and nanomedicine.
    cadence: continuous; monthly issues
    tier: primary
  - name: National Nanotechnology Initiative — news
    url: https://www.nano.gov/news-impact/
    items: ["*"]
    covers: US federal nanotechnology programme news and agency highlights.
    cadence: irregular
    tier: primary
  - name: C&EN — nanomaterials
    url: https://cen.acs.org/topics/materials/nanomaterials.html
    items: ["*"]
    covers: Chemistry-trade reporting on nanomaterials research and commercialization.
    cadence: continuous
    tier: news
  # --- Mathematics ---------------------------------------------------------------------------------
  - name: Quanta Magazine
    url: https://www.quantamagazine.org/
    items: ["*"]
    covers: High-signal reporting on major results in mathematics, physics, biology and computer science (incl. AI-assisted proofs).
    cadence: several articles per week
    tier: news
  - name: Terence Tao — "What's new"
    url: https://terrytao.wordpress.com/
    items: ["*"]
    covers: Research blog of a leading mathematician; first-hand assessments of AI in mathematics (formal proofs, Erdős problems).
    cadence: irregular
    tier: primary
  - name: Google DeepMind — blog
    url: https://deepmind.google/blog/
    items: ["*"]
    covers: AI-for-science results (AlphaFold, AlphaProof, AlphaEvolve, fusion control, weather).
    cadence: continuous
    tier: primary
  # --- Neuroscience / brain-computer interfaces -----------------------------------------------------
  - name: Nature Neuroscience — articles
    url: https://www.nature.com/neuro/articles
    items: ["*"]
    covers: Peer-reviewed neuroscience (connectomics, neural recording, neurotechnology).
    cadence: continuous
    tier: primary
  - name: Neuralink — updates
    url: https://neuralink.com/updates/
    items: ["*"]
    covers: Implanted BCI trial participants, capabilities (cursor, speech, robotic arm), device revisions.
    cadence: irregular
    tier: primary
  - name: Synchron — news
    url: https://synchron.com/news
    items: ["*"]
    covers: Endovascular BCI trials and FDA pivotal-trial progress.
    cadence: irregular
    tier: primary
  - name: Paradromics — news
    url: https://paradromics.com/news/
    items: ["*"]
    covers: High-bandwidth BCI (Connexus) first-in-human and clinical-trial milestones.
    cadence: irregular
    tier: primary
  # --- Fundamental physics / general science --------------------------------------------------------
  - name: CERN — news
    url: https://home.cern/news/
    items: ["*"]
    covers: LHC results and run schedule, High-Luminosity LHC, Future Circular Collider decisions.
    cadence: continuous
    tier: primary
  - name: Nature — research articles
    url: https://www.nature.com/nature/research-articles
    items: ["*"]
    covers: Nature's research papers across all fields (the main venue for paradigm-level results).
    cadence: continuous; weekly issues (Wednesday/Thursday)
    tier: primary
    note: bot-blocked
